name: Publish public learning resources
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      generate_audio:
        description: Generate bounded missing article audio before deployment
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish.yml'
      - 'package*.json'
      - 'packages/content-pipeline/src/**'
      - 'scripts/**'
      - 'apps/web/public/lexicon/**'
      - 'apps/web/public/download/**'
      - 'apps/web/public/app/**'
      - 'apps/web/public/index.html'
      - 'apps/web/public/health/**'
      - 'apps/web/public/reading/audio/**'
      - 'apps/web/public/speech/**'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages-public-resources
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run update
        env:
          NODE_USE_ENV_PROXY: '1'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Generate bounded missing natural audio
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.generate_audio)
        continue-on-error: true
        timeout-minutes: 32
        run: |
          python -m pip install -r scripts/speech/requirements.txt
          mkdir -p artifacts
          npx tsx scripts/speech/input.ts artifacts/speech-input.json
          python scripts/speech/generate.py --max-articles 8 --max-seconds 1500 --max-bytes 524288000
      - run: npm run validate
      - name: Preserve catalog and immutable body history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- apps/web/src/reading/reading-catalog.json apps/web/public/reading/catalog.json apps/web/public/reading/catalog-v2.json apps/web/public/reading/articles
          if [ -d apps/web/public/reading/audio ]; then git add -- apps/web/public/reading/audio; fi
          if ! git diff --cached --quiet; then
            git commit -m 'Update public reading catalog and versioned bodies'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/public
      - name: Deploy resources
        id: deployment
        uses: actions/deploy-pages@v4
